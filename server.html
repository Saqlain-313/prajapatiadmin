<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DEV // ALL MODE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
body { font-family: 'JetBrains Mono', monospace; background:black; }

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.glass {
  backdrop-filter: blur(18px);
  box-shadow: 0 0 40px rgba(0,255,150,.25);
}

.glitch {
  animation: glitch 1.2s infinite;
}
@keyframes glitch {
  0% { text-shadow: 2px 0 red, -2px 0 cyan; }
  50% { text-shadow: -2px 0 red, 2px 0 cyan; }
  100% { text-shadow: 2px 0 red, -2px 0 cyan; }
}

.caret::after {
  content:"▌";
  animation: blink 1s infinite;
}
@keyframes blink {
  0%,50%,100%{opacity:1}
  25%,75%{opacity:0}
}
</style>
</head>

<body class="text-green-400 overflow-hidden">

<!-- MATRIX -->
<canvas id="matrix"></canvas>

<!-- TERMINAL -->
<div class="relative z-10 min-h-screen flex items-center justify-center p-4">
  <div class="glass bg-black/80 border border-green-400/40 rounded-xl w-full max-w-4xl p-6">

    <!-- HEADER -->
    <div class="flex items-center gap-2 mb-4">
      <span class="w-3 h-3 bg-red-500 rounded-full"></span>
      <span class="w-3 h-3 bg-yellow-400 rounded-full"></span>
      <span class="w-3 h-3 bg-green-500 rounded-full"></span>
      <span class="ml-4 glitch text-green-300">DEV-ALL-MODE</span>
    </div>

    <!-- OUTPUT -->
    <pre id="output" class="text-sm md:text-base leading-relaxed min-h-[320px] whitespace-pre-wrap caret"></pre>

    <!-- INPUT -->
    <div class="flex items-center mt-3">
      <span class="mr-2 text-green-500">&gt;</span>
      <input
        id="input"
        autofocus
        class="bg-transparent flex-1 outline-none text-green-300"
        placeholder="type command..."
      />
    </div>

  </div>
</div>

<!-- SOUND -->
<audio id="beep" src="https://assets.mixkit.co/sfx/preview/mixkit-click-error-1110.mp3"></audio>

<script>
/* ================= MATRIX ================= */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const letters = "Stark🚀😎";
const fontSize = 14;
const cols = canvas.width / fontSize;
const drops = Array.from({length: cols}).fill(1);

function drawMatrix(){
  ctx.fillStyle = "rgba(0,0,0,.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#00ff9c";
  ctx.font = fontSize+"px monospace";
  drops.forEach((y,i)=>{
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,y*fontSize);
    if(y*fontSize>canvas.height && Math.random()>0.975) drops[i]=0;
    drops[i]++;
  });
}
setInterval(drawMatrix,33);

/* ================= TERMINAL ================= */
const output = document.getElementById("output");
const input = document.getElementById("input");
const beep = document.getElementById("beep");

const boot = [
"> booting system...",
"> loading ai_brain.js",
"> checking bugs...",
"> bugs found: YES",
"> ignoring bugs...",
"> system stable ✔",
"",
"aaj k liye itna kafi h",
"baki kal dekhege 😏",
"",
"Type <help> to see commands"
];

let l=0,c=0;
function bootType(){
  if(l<boot.length){
    if(c<boot[l].length){
      output.textContent+=boot[l][c++];
    }else{
      output.textContent+="\n";
      l++; c=0;
    }
  }
}
setInterval(bootType,35);

const commands={
help:`Commands:
status
meme
kal
deploy
portfolio
ai
clear`,
status:`✔ Motivation: LOW
✔ Confidence: MAX
✔ Bugs: INFINITE`,
meme:`console.log("Trust me bro, production pe hi test karenge 😎")`,
kal:`aaj k liye itna kafi h\nbaki kal dekhege`,
deploy:`🚀 Deploying...\n❌ Tests skipped\n🔥 Production LIVE`,
portfolio:`👨‍💻 Developer Portfolio
Skills: JS | Node | React
Experience: StackOverflow`,
ai:`🤖 AI RESPONSE:
"Kal ka kaam kal pe chhod do."`
};

function print(t){
  output.textContent+="\n"+t;
  output.scrollTop=output.scrollHeight;
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    beep.play();
    const cmd=input.value.trim().toLowerCase();
    print("> "+cmd);
    if(cmd==="clear") output.textContent="";
    else if(commands[cmd]) print(commands[cmd]);
    else print("Command not found 😵");
    input.value="";
  }
});
</script>

</body>
</html>
