<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wrestling Match Viewer</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body class="bg-slate-900 p-6">

<div id="app" class="max-w-7xl mx-auto bg-white rounded overflow-hidden">

  <!-- 🔴 CLOSED BANNER -->
  <div id="closedBanner"
       class="hidden text-center py-6 bg-red-600 text-white text-5xl font-extrabold tracking-widest">
    CLOSED
  </div>

  <!-- HEADER -->
  <div class="grid grid-cols-7 text-center text-sm font-semibold">
    <div></div>
    <div class="col-span-2 bg-sky-400 text-white py-2">Back</div>
    <div class="col-span-2 bg-pink-400 text-white py-2">Lay</div>
    <div class="col-span-2 bg-teal-200 py-2">Min / Max</div>
  </div>

  <!-- ROWS -->
  <div id="rows"></div>
</div>

<script>
  const MATCH_ID = "69799ce1b3d70fccf500ac50";
  const API_URL = `http://localhost:5100/api/wrestling/match/${MATCH_ID}`;
  const socket = io("http://localhost:5100", { transports: ["websocket"] });

  let CURRENT_MATCH = null;

  /* ================= FETCH MATCH ================= */
  async function fetchMatch() {
    const res = await fetch(API_URL);
    const json = await res.json();
    if (!json?.data) return;

    CURRENT_MATCH = json.data;

    socket.emit("join-match", String(json.data.mid));
    render();
  }

  /* ================= RENDER ================= */
  function render() {
    if (!CURRENT_MATCH) return;

    const rows = document.getElementById("rows");
    const banner = document.getElementById("closedBanner");

    rows.innerHTML = "";

    const status = String(CURRENT_MATCH.status || "").toUpperCase();

    /* 🔴 ANYTHING OTHER THAN OPEN = CLOSED */
    if (status !== "OPEN") {
      banner.classList.remove("hidden");
    } else {
      banner.classList.add("hidden");
    }

    CURRENT_MATCH.teams.forEach(team => {
      const getBox = id => team.boxes?.find(b => b.boxId == id) || {};
      const b2 = getBox(2);
      const b3 = getBox(3);

      rows.innerHTML += `
      <div class="grid grid-cols-7 border-t text-center text-sm">
        <div class="text-left px-3 py-3 font-semibold">
          ${team.tname}
        </div>

        <div class="bg-sky-100 py-2">—</div>

        <div class="bg-sky-200 py-2" id="box-${team.tid}-2">
          <div class="font-bold rate">${b2.rate ?? 0}</div>
          <div class="text-xs size">${b2.size ?? 0}</div>
        </div>

        <div class="bg-pink-200 py-2" id="box-${team.tid}-3">
          <div class="font-bold rate">${b3.rate ?? 0}</div>
          <div class="text-xs size">${b3.size ?? 0}</div>
        </div>

        <div class="bg-pink-100 py-2">—</div>

        <div class="bg-teal-50 py-2 font-semibold">${b2.min ?? 0}</div>
        <div class="bg-teal-50 py-2 font-semibold">${b2.max ?? 0}</div>
      </div>`;
    });
  }

  /* ================= SOCKET UPDATE ================= */
  socket.on("box:update", data => {

    /* 🔴 STATUS UPDATE */
    if (data.status) {
      CURRENT_MATCH.status = data.status;
      render();
      return;
    }

    const box = document.getElementById(`box-${data.tid}-${data.boxId}`);
    if (!box) return;

    if (data.rate !== undefined)
      box.querySelector(".rate").innerText = data.rate;

    if (data.size !== undefined)
      box.querySelector(".size").innerText = data.size;
  });

  fetchMatch();
</script>

</body>
</html>
