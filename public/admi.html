<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wrestling Admin Panel</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-black text-white min-h-screen p-6">

<div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">

  <!-- ================= ADMIN PANEL ================= -->
  <div class="bg-white/5 backdrop-blur-xl p-6 rounded-2xl border border-white/10 shadow-xl">

    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-red-400">🛠 Wrestling Admin</h1>
      <span id="matchBadge" class="hidden px-3 py-1 rounded-full text-xs font-bold"></span>
    </div>

    <label class="text-xs text-gray-400">Match ID</label>
    <input id="matchId"
      class="w-full mb-3 p-2.5 rounded-lg bg-slate-800 border border-slate-600"
      value="69799ce1b3d70fccf500ac50" />

    <button onclick="fetchMatch()"
      class="w-full mb-3 bg-gradient-to-r from-blue-600 to-indigo-600 p-2.5 rounded-lg font-bold">
      📥 Fetch Match
    </button>

    <button id="closeBtn" onclick="closeMatch()"
      class="hidden w-full mb-3 bg-gradient-to-r from-yellow-500 to-orange-500 p-2.5 rounded-lg font-bold">
      🔒 Close Match
    </button>

    <button id="openBtn" onclick="openMatch()"
      class="hidden w-full mb-3 bg-gradient-to-r from-green-500 to-emerald-600 p-2.5 rounded-lg font-bold">
      🔓 Open Match
    </button>

    <div class="grid grid-cols-2 gap-3">
      <select id="tid" class="p-2 rounded bg-slate-800 border border-slate-600"></select>
      <select id="boxId" class="p-2 rounded bg-slate-800 border border-slate-600"></select>
    </div>

    <div class="grid grid-cols-3 gap-3 mt-3">
      <input id="rate" placeholder="Rate" type="number"
        class="p-2 rounded bg-slate-800 border border-slate-600" />
      <input id="size" placeholder="Size" type="number"
        class="p-2 rounded bg-slate-800 border border-slate-600" />
      <input id="timer" placeholder="Timer" type="number"
        class="p-2 rounded bg-slate-800 border border-slate-600" />
    </div>

    <button onclick="updateBox()"
      class="w-full mt-4 bg-gradient-to-r from-red-600 to-pink-600 p-3 rounded-xl font-bold">
      🔥 Update Box
    </button>

    <p id="status" class="mt-3 text-center text-sm text-gray-300"></p>
  </div>

  <!-- ================= LIVE VIEW ================= -->
  <div id="matchView"
    class="bg-white/5 backdrop-blur-xl p-4 rounded-2xl border border-white/10 shadow-xl overflow-y-auto max-h-[80vh]">
    <p class="text-gray-400 text-center mt-10">No match loaded</p>
  </div>

</div>

<script>
const API_BASE = "http://localhost:5100/api/wrestling/match";
const socket = io("http://localhost:5100", { transports: ["websocket"] });

let MATCH = null;

const setStatus = msg => status.innerText = msg;
const lockInputs = () => ["rate","size","timer"].forEach(i => document.getElementById(i).disabled = true);
const unlockInputs = () => ["rate","size","timer"].forEach(i => document.getElementById(i).disabled = false);

/* ================= FETCH MATCH ================= */
async function fetchMatch() {
  const id = matchId.value.trim();
  try {
    const res = await fetch(`${API_BASE}/${id}/closed`);
    const json = await res.json();
    if (!json.success) return setStatus("❌ " + json.message);

    MATCH = json.data;
    socket.emit("join-match", String(MATCH.mid));
    populateSelectors();
    renderMatch();
    updateUI();
    setStatus("✅ Match loaded");
  } catch {
    setStatus("❌ Failed to fetch match");
  }
}

/* ================= UI UPDATE ================= */
function updateUI() {
  matchBadge.classList.remove("hidden");

  if (MATCH.status === "OPEN") {
    matchBadge.innerText = "OPEN";
    matchBadge.className = "px-3 py-1 rounded-full text-xs font-bold bg-green-600";
    closeBtn.classList.remove("hidden");
    openBtn.classList.add("hidden");
    unlockInputs();
  } else {
    matchBadge.innerText = "CLOSED";
    matchBadge.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-600";
    openBtn.classList.remove("hidden");
    closeBtn.classList.add("hidden");
    lockInputs();
  }
}

/* ================= OPEN / CLOSE ================= */
async function closeMatch() {
  const res = await fetch(`${API_BASE}/${MATCH._id}/close`, { method: "PUT" });
  if (!res.ok) return setStatus("❌ Failed to close match");

  MATCH.status = "CLOSED";
  updateUI();
  setStatus("🔒 MATCH CLOSED");
}

async function openMatch() {
  const res = await fetch(`${API_BASE}/${MATCH._id}/open`, { method: "PUT" });
  if (!res.ok) return setStatus("❌ Failed to open match");

  MATCH.status = "OPEN";
  updateUI();
  setStatus("🔓 MATCH OPENED");
}

/* ================= UPDATE BOX ================= */
function updateBox() {
  if (!MATCH || MATCH.status !== "OPEN")
    return setStatus("⚠ Match is closed");

  socket.emit("admin:update-box", {
    matchId: MATCH._id,
    mid: MATCH.mid,
    tid: tid.value,
    boxId: boxId.value,
    rate: +rate.value,
    size: +size.value,
    timer: +timer.value
  });

  setStatus("🚀 Update sent");
}

/* ================= SOCKET UPDATE ================= */
socket.on("box:update", ({ tid, boxId, rate, size, timer }) => {
  if (!MATCH) return;

  const team = MATCH.teams.find(t => t.tid == tid);
  if (!team) return;

  const box = team.boxes.find(b => b.boxId == boxId);
  if (!box) return;

  if (rate != null) box.rate = rate;
  if (size != null) box.size = size;
  if (timer != null) box.timer = timer;

  renderMatch();
});

/* ================= HELPERS ================= */
function populateSelectors() {
  tid.innerHTML = "";
  MATCH.teams.forEach(t => tid.innerHTML += `<option value="${t.tid}">Team ${t.tid}</option>`);

  tid.onchange = () => {
    boxId.innerHTML = "";
    MATCH.teams.find(t => t.tid == tid.value).boxes.forEach(b => {
      boxId.innerHTML += `<option value="${b.boxId}">
        ${b.boxId == 2 ? "Back" : b.boxId == 3 ? "Lay" : "Box " + b.boxId}
      </option>`;
    });
  };
  tid.onchange();
}

/* ================= RENDER MATCH ================= */
function renderMatch() {
  let html = `
  <div class="rounded-xl overflow-hidden bg-white text-black">
    <div class="p-3 font-bold bg-gradient-to-r from-indigo-600 to-pink-600 text-white">
      🏆 Winner Market (${MATCH.status})
    </div>
    <table class="w-full text-center text-sm">
      <thead class="bg-slate-200">
        <tr><th>Team</th><th>Back</th><th>Lay</th><th>Timer</th></tr>
      </thead><tbody>`;

  MATCH.teams.forEach(t => {
    const back = t.boxes.find(b => b.boxId == 2) || {};
    const lay = t.boxes.find(b => b.boxId == 3) || {};
    html += `
      <tr class="border-t">
        <td class="font-bold">Team ${t.tid}</td>
        <td class="bg-green-500 text-white font-bold">${back.rate ?? "-"}</td>
        <td class="bg-red-500 text-white font-bold">${lay.rate ?? "-"}</td>
        <td>⏱ ${back.timer ?? lay.timer ?? 0}s</td>
      </tr>`;
  });

  matchView.innerHTML = html + "</tbody></table></div>";
}
</script>

</body>
</html>
